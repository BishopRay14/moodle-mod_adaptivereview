name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # plugin-ci creates its target database during installation.
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            moodle-branch: 'MOODLE_500_STABLE'
            database: pgsql
            postgres: '16'
          - php: '8.3'
            moodle-branch: 'MOODLE_502_STABLE'
            database: pgsql
            postgres: '17'
          - php: '8.3'
            moodle-branch: 'MOODLE_503_STABLE'
            database: pgsql
            postgres: '17'
          - php: '8.4'
            moodle-branch: 'MOODLE_503_STABLE'
            database: pgsql
            postgres: '17'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pgsql, zip, gd
          ini-values: max_input_vars=5000
          coverage: pcov

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci && pwd)/bin >> $GITHUB_PATH
          echo $(cd ci && pwd)/vendor/bin >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
        env:
          COMPOSER_NO_INTERACTION: 1

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci install \
            --plugin ./plugin \
            --db-host 127.0.0.1 \
            --db-user postgres \
            --db-pass postgres \
            --db-name moodle \
            --db-port 5432 \
            --branch ${{ matrix.moodle-branch }} \
            --db-type ${{ matrix.database }}
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint ./plugin

      - name: PHP Mess Detector
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd ./plugin

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci codechecker ./plugin

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc ./plugin

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate ./plugin

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints ./plugin

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        # Moodle 5.1 moved web-facing code beneath public/. Mustache lint must
        # inspect the installed plugin path inside the matching Moodle dirroot.
        run: |
          if [ -d ./moodle/public/mod/adaptivereview ]; then
            moodle-plugin-ci mustache ./moodle/public/mod/adaptivereview
          else
            moodle-plugin-ci mustache ./moodle/mod/adaptivereview
          fi

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --coverage-clover ./plugin

      - name: Behat features
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile default ./plugin
